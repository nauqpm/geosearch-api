services:
  postgres_dev:
    image: postgis/postgis:16-3.4
    container_name: geosearch_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEV_DB_USER:-user}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${DEV_DB_NAME:-geosearch_dev}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - geosearch_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-user} -d ${DEV_DB_NAME:-geosearch_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres_test:
    image: postgis/postgis:16-3.4
    container_name: geosearch_postgres_test
    restart: "no"
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-user}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test_password}
      POSTGRES_DB: ${TEST_DB_NAME:-geosearch_test}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-user} -d ${TEST_DB_NAME:-geosearch_test}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  geosearch_dev_pgdata:
    name: geosearch_dev_pgdata
