[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geosearch-api"
version = "0.1.0"
description = "GeoSearch API"
requires-python = ">=3.12,<3.13"

dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.14,<2.0",
    "osmium>=4.0,<5.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "python-dotenv>=1,<2",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["geosearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "s1: S1 Unit tests (pure Python rules, normalization, validation, classification, evaluation)",
    "s2: S2 Database Integration tests (real PostgreSQL/PostGIS constraints, queries, spatial behavior)",
    "s3: S3 Migration tests (Alembic G1-G6 checks on isolated databases)",
    "s4: S4 Workflow tests (publication, controlled recovery, durable evidence, history)",
    "s5: S5 Race & Fault Injection tests (independent connections, checkpoints, rollback, snapshots)",
]
