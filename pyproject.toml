[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geosearch-api"
version = "0.1.0"
description = "GeoSearch API"
requires-python = ">=3.12,<3.13"

dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.14,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["geosearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
